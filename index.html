const volume=w=>w.exercises.reduce((a,e)=>a+e.sets.filter(s=>s.done).reduce((b,s)=>b+(+s.weight||0)*(+s.reps||0),0),0),setCount=w=>w.exercises.reduce((a,e)=>a+e.sets.filter(s=>s.done).length,0);function weekStart(){let x=new Date();x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return +x}function go(id,i){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('.nav button').forEach((x,n)=>x.classList.toggle('on',i===n));if(id==='progress')renderProgress();if(id==='settings')renderSettings()}function closeModal(id){$(id).classList.remove('show')}

function startWorkout(id){let r=d.routines.find(x=>x.id===id);workout={id:uid(),routineId:id,name:r.name,started:Date.now(),notes:'',exercises:r.exercises.map(e=>({name:e.name,notes:e.notes,sets:Array.from({length:e.sets},()=>({weight:'',reps:'',done:false}))}))};saveActive();openWorkout()}function resumeWorkout(){workout=d.active;openWorkout()}function saveActive(){d.active=workout;localSave()}function openWorkout(){$('workName').textContent=workout.name;$('workNotes').value=workout.notes||'';drawWorkout();$('workModal').classList.add('show');clearInterval(tick);let time=()=>{let s=Math.floor((Date.now()-workout.started)/1000);$('workTime').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};time();tick=setInterval(time,1000)}function drawWorkout(){$('workExercises').innerHTML=workout.exercises.map((e,ei)=>`<div class="card exercise"><h3>${esc(e.name)}</h3><div class="muted">${summary(e.name)}${e.notes?' · '+esc(e.notes):''}</div>${e.sets.map((s,si)=>`<div class="set"><span>${si+1}</span><input class="input ${s.done?'done':''}" value="${esc(s.weight)}" inputmode="decimal" placeholder="kg" oninput="workout.exercises[${ei}].sets[${si}].weight=this.value;saveActive()"><input class="input ${s.done?'done':''}" value="${esc(s.reps)}" inputmode="numeric" placeholder="reps" oninput="workout.exercises[${ei}].sets[${si}].reps=this.value;saveActive()"><button class="icon ${s.done?'done':''}" onclick="toggleSet(${ei},${si})">${s.done?'✓':'○'}</button></div>`).join('')}</div>`).join('')}function toggleSet(e,s){let x=workout.exercises[e].sets[s];x.done=!x.done;saveActive();drawWorkout();if(x.done)startRest(d.rest)}function finishWorkout(){if(!workout)return;stopRest();workout.duration=Math.round((Date.now()-workout.started)/1000);d.history.unshift(workout);d.active=null;workout=null;clearInterval(tick);localSave();closeModal('workModal');render();toast('Workout saved')}
let restInt=null,restEnd=0,restLeft=0,restPaused=false;function restPaint(){let left=restPaused?restLeft:Math.max(0,(restEnd-Date.now())/1000);restLeft=left;if(left<=0)return stopRest(true);$('restTimer').classList.add('show');$('restTimer').innerHTML=`<div><b>Rest ${Math.floor(left/60)}:${String(Math.ceil(left)%60).padStart(2,'0')}</b><small>${restPaused?'Paused':'Next set when ready'}</small></div><div class="timer-actions"><button onclick="pauseRest()">${restPaused?'Resume':'Pause'}</button><button onclick="addRest(30)">+30</button><button class="stop" onclick="stopRest()">Stop</button></div>`}function startRest(n){stopRest();restPaused=false;restLeft=n||90;restEnd=Date.now()+restLeft*1000;restPaint();restInt=setInterval(restPaint,250)}function pauseRest(){if(restPaused){restPaused=false;restEnd=Date.now()+restLeft*1000;restInt=setInterval(restPaint,250)}else{restLeft=Math.max(0,(restEnd-Date.now())/1000);restPaused=true;clearInterval(restInt);restInt=null}restPaint()}function addRest(n){restPaused?restLeft+=n:restEnd+=n*1000;restPaint()}function stopRest(done=false){clearInterval(restInt);restInt=null;restPaused=false;$('restTimer').classList.remove('show');$('restTimer').innerHTML='';if(done)toast('Rest complete')}function setRest(n){if(!n||n<1)return;d.rest=n;localSave();renderSettings();toast('Rest set to '+n+' seconds')}
function e1rm(w,r){return r?Math.round(w*(1+r/30)*10)/10:0}function records(){let z={};d.history.forEach(w=>w.exercises.forEach(e=>e.sets.filter(s=>s.done).forEach(s=>{let wt=+s.weight||0,r=+s.reps||0,k=e.name.toLowerCase();if(wt&&(!z[k]||e1rm(wt,r)>e1rm(z[k].weight,z[k].reps)))z[k]={name:e.name,weight:wt,reps:r}})));return Object.values(z)}function chart(a){let c=$('exerciseChart'),x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);if(!a.length){x.fillStyle='#78827b';x.fillText('Complete workouts to see progress',18,28);return}let v=a.map(y=>y.max),lo=Math.min(...v),hi=Math.max(...v);if(lo===hi){lo--;hi++}let p=30;x.strokeStyle='#159447';x.lineWidth=3;x.beginPath();a.forEach((q,i)=>{let px=p+(c.width-2*p)*(a.length===1?.5:i/(a.length-1)),py=c.height-p-(c.height-2*p)*(q.max-lo)/(hi-lo);i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke()}function renderProgress(){let names=[...new Set(d.history.flatMap(w=>w.exercises.map(e=>e.name)))],s=$('exerciseSelect'),old=s.value;s.innerHTML=names.map(x=>`<option>${esc(x)}</option>`).join('');if(names.includes(old))s.value=old;renderExercise();$('records').innerHTML=records().map(r=>`<div class="card between"><b>${esc(r.name)}</b><span class="pr">${r.weight} kg × ${r.reps} · 1RM ${e1rm(r.weight,r.reps)}</span></div>`).join('')||'<div class="card muted">No records yet.</div>';$('history').innerHTML=d.history.map((w,i)=>`<div class="card between"><div><b>${esc(w.name)}</b><div class="muted">${new Date(w.started).toLocaleString()} · ${Math.round(w.duration/60)} min · ${setCount(w)} sets</div></div><button class="btn danger" onclick="deleteWorkout(${i})">Delete</button></div>`).join('')||'<div class="card muted">No workouts yet.</div>'}function renderExercise(){let a=sessions($('exerciseSelect').value).reverse(),l=a.at(-1);$('exerciseStats').innerHTML=l?`<div class="card stat"><b>${l.max}</b><span>MAX KG</span></div><div class="card stat"><b>${l.sets}</b><span>SETS</span></div><div class="card stat"><b>${Math.round(l.volume)}</b><span>VOLUME</span></div>`:'';chart(a)}function deleteWorkout(i){if(confirm('Delete workout?')){d.history.splice(i,1);localSave();renderProgress();render()}}function renderSettings(){$('restInfo').textContent='Current: '+d.rest+' seconds'}function toggleDark(){d.dark=!d.dark;localSave();applyTheme()}function applyTheme(){document.body.classList.toggle('dark',!!d.dark)}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:'application/json'}));a.download='gym-premium-v5.1-backup.json';a.click()}document.addEventListener('visibilitychange',()=>{if(!document.hidden&&(restInt||restPaused))restPaint()});window.addEventListener('online',pushCloud);if(session)enterApp();else applyTheme();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
