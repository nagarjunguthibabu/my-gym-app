<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f1115"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>My Gym Plan V2</title><style>
:root{--bg:#f5f6f8;--card:#fff;--text:#16181d;--muted:#707782;--line:#e4e7ec;--green:#16a34a;--soft:#dcfce7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;padding-bottom:82px}body.dark{--bg:#0f1115;--card:#191c22;--text:#f7f7f8;--muted:#a1a7b1;--line:#30343b;--soft:#153d25}.wrap{max-width:720px;margin:auto;padding:calc(15px + env(safe-area-inset-top)) 15px 20px}.top,.row,.between{display:flex;align-items:center}.between{justify-content:space-between;gap:10px}.top{justify-content:space-between;margin-bottom:18px}.brand{font-weight:900;font-size:21px}.pill{font-size:11px;background:var(--soft);color:#15803d;padding:6px 9px;border-radius:99px}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:15px}.quick{background:linear-gradient(135deg,#166534,#16a34a);color:#fff;border:0;margin:14px 0}.quick .muted{color:#dcfce7}.muted{color:var(--muted);font-size:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{text-align:center;padding:11px 5px}.stat b{display:block;font-size:19px}.stat span{font-size:10px;color:var(--muted)}h1{font-size:25px;margin:2px 0}h2{font-size:17px;margin:22px 2px 10px}.grid{display:grid;gap:9px}.routine h3{margin:0 0 4px;font-size:16px}.actions{display:flex;gap:6px}.btn,.icon{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:11px;padding:10px 13px;font-weight:750}.primary{background:var(--green);border-color:var(--green);color:#fff}.icon{width:40px;padding:9px}.templates{display:flex;gap:8px;overflow:auto}.screen{display:none}.screen.active{display:block}.nav{position:fixed;bottom:0;left:0;right:0;height:70px;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:env(safe-area-inset-bottom)}.nav button{border:0;background:none;color:var(--muted);font-weight:700}.nav button.on{color:var(--green)}.modal{display:none;position:fixed;inset:0;background:#0009;z-index:5;align-items:flex-end}.modal.show{display:flex}.sheet{background:var(--bg);width:100%;max-width:720px;max-height:94vh;overflow:auto;margin:auto;padding:17px;border-radius:22px 22px 0 0}.input{width:100%;padding:11px;border:1px solid var(--line);border-radius:11px;background:var(--card);color:var(--text);margin:5px 0 10px}.exercise{margin:9px 0}.set{display:grid;grid-template-columns:32px 1fr 1fr 40px;gap:6px;align-items:center;margin-top:7px}.set input{min-width:0;text-align:center}.done{background:var(--soft)!important}.sticky{position:sticky;top:0;background:var(--bg);padding-bottom:10px}.history{margin-bottom:8px}canvas{width:100%;height:190px}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.photos img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px}.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 15px;border-radius:99px;display:none;z-index:9}@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:22px}}
</style></head><body><main class="wrap"><div class="top"><div class="brand">My Gym Plan</div><div class="pill">V2 · Offline</div></div>
<section id="plans" class="screen active"><div class="between"><div><div class="muted" id="greet"></div><h1>Ready to train?</h1></div><button class="icon" onclick="go('settings',2)">⚙</button></div><div id="quick"></div><div class="stats"><div class="card stat"><b id="streak">0</b><span>DAY STREAK</span></div><div class="card stat"><b id="weekly">0</b><span>THIS WEEK</span></div><div class="card stat"><b id="weight">–</b><span>BODY WEIGHT</span></div></div><div class="between"><h2>Your routines</h2><button class="btn" onclick="editRoutine()">+ New</button></div><div id="routines" class="grid"></div><h2>Starter templates</h2><div class="templates"><button class="btn" onclick="template('Push')">+ Push</button><button class="btn" onclick="template('Pull')">+ Pull</button><button class="btn" onclick="template('Legs')">+ Legs</button></div></section>
<section id="progress" class="screen"><h1>Progress</h1><div class="stats" id="totals"></div><h2>Exercise progress</h2><div class="card"><select id="chartEx" class="input" onchange="chart()"></select><canvas id="chart" width="650" height="190"></canvas></div><h2>Personal records</h2><div id="prs" class="grid"></div><h2>Workout history</h2><div id="history" class="grid"></div></section>
<section id="settings" class="screen"><h1>Settings</h1><h2>Body weight</h2><div class="card"><div class="row"><input id="bw" class="input" type="number" step=".1" placeholder="kg"><button class="btn primary" onclick="saveWeight()">Save</button></div><div id="bwInfo" class="muted"></div></div><h2>Progress photos</h2><div class="card"><input type="file" accept="image/*" capture="environment" onchange="photo(event)"><div id="photos" class="photos"></div></div><h2>Preferences</h2><div class="card"><button class="btn" onclick="dark()">Toggle dark mode</button><label class="muted" style="display:block;margin-top:12px">Rest timer seconds</label><input id="rest" class="input" type="number" onchange="saveRest()"></div><h2>Backup</h2><div class="card"><button class="btn" onclick="exportData()">Export</button> <button class="btn" onclick="imp.click()">Import</button><input id="imp" hidden type="file" accept="application/json" onchange="importData(event)"></div></section></main>
<nav class="nav"><button class="on" onclick="go('plans',0)">Plans</button><button onclick="go('progress',1)">Progress</button><button onclick="go('settings',2)">Settings</button></nav>
<div id="routineModal" class="modal"><div class="sheet"><h1 id="editTitle">Routine</h1><input id="rname" class="input" placeholder="Routine name"><div id="editor"></div><button class="btn" onclick="addExercise()">+ Exercise</button><div class="between" style="margin-top:15px"><button class="btn" onclick="closeM('routineModal')">Cancel</button><button id="delBtn" class="btn" onclick="deleteRoutine()">Delete</button><button class="btn primary" onclick="saveRoutine()">Save</button></div></div></div>
<div id="workModal" class="modal"><div class="sheet"><div class="sticky between"><div><h1 id="wname"></h1><div id="timer" class="muted"></div></div><button class="btn primary" onclick="finish()">Finish</button></div><div id="work"></div></div></div><div id="toast" class="toast"></div>
<script>
const K='gymV2',uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2);let d=JSON.parse(localStorage.getItem(K)||'null')||{routines:[],history:[],weights:[],photos:[],rest:90,dark:true},editing=null,eds=[],wo=null,tick,restTick;const $=x=>document.getElementById(x),save=()=>localStorage.setItem(K,JSON.stringify(d)),esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function msg(x){$('toast').textContent=x;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',1500)}function go(id,i){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('.nav button').forEach((x,n)=>x.classList.toggle('on',n===i));if(id==='progress')renderProgress();if(id==='settings')renderSettings()}function closeM(x){$(x).classList.remove('show')}
const T={Push:[['Bench Press',3,'6-10'],['Incline Dumbbell Press',3,'8-12'],['Shoulder Press',3,'8-12'],['Lateral Raise',3,'12-15'],['Triceps Pushdown',3,'10-15']],Pull:[['Lat Pulldown',3,'8-12'],['Seated Cable Row',3,'8-12'],['Face Pull',3,'12-15'],['Dumbbell Curl',3,'8-12'],['Hammer Curl',3,'10-15']],Legs:[['Squat',3,'6-10'],['Romanian Deadlift',3,'8-12'],['Leg Press',3,'10-15'],['Leg Curl',3,'10-15'],['Calf Raise',4,'10-15']]};
function template(n){if(d.routines.some(x=>x.name===n))return msg('Already added');d.routines.push({id:uid(),name:n,exercises:T[n].map(x=>({id:uid(),name:x[0],sets:x[1],reps:x[2],notes:''}))});save();render();msg(n+' added')}
function render(){let h=new Date().getHours();$('greet').textContent=h<12?'Good morning':h<18?'Good afternoon':'Good evening';let last=d.history[0],valid=last&&d.routines.find(x=>x.id===last.routineId);$('quick').innerHTML=`<div class="card quick between"><div><div class="muted">${valid?'START LAST WORKOUT':'QUICK START'}</div><b>${valid?esc(last.name):d.routines.length?'Choose a routine below':'Create your first routine'}</b></div><button class="btn" onclick="${valid?`start('${last.routineId}')`:'editRoutine()'}">${valid?'Start':'Create'}</button></div>`;let days=[...new Set(d.history.map(x=>new Date(x.started).toDateString()))],st=0,x=new Date();for(let i=0;i<365;i++){if(days.includes(x.toDateString()))st++;else if(i)break;x.setDate(x.getDate()-1)}$('streak').textContent=st;let m=new Date();m.setHours(0,0,0,0);m.setDate(m.getDate()-((m.getDay()+6)%7));$('weekly').textContent=d.history.filter(x=>x.started>=+m).length;$('weight').textContent=d.weights.length?d.weights[0].v+' kg':'–';$('routines').innerHTML=d.routines.length?d.routines.map(r=>`<div class="card routine between"><div><h3>${esc(r.name)}</h3><div class="muted">${r.exercises.length} exercises · ${r.exercises.reduce((n,e)=>n+e.sets,0)} sets</div></div><div class="actions"><button class="icon" onclick="editRoutine('${r.id}')">✎</button><button class="btn primary" onclick="start('${r.id}')">Start</button></div></div>`).join(''):'<div class="card muted">No routines yet. Add a starter template or create your own.</div>'}
function editRoutine(id){editing=id||null;let r=d.routines.find(x=>x.id===id);$('rname').value=r?r.name:'';eds=r?structuredClone(r.exercises):[{id:uid(),name:'',sets:3,reps:'8-12',notes:''}];$('delBtn').style.display=r?'block':'none';renderEditor();$('routineModal').classList.add('show')}function renderEditor(){$('editor').innerHTML=eds.map((e,i)=>`<div class="card exercise"><input class="input" placeholder="Exercise" value="${esc(e.name)}" oninput="eds[${i}].name=this.value"><div class="row" style="gap:7px"><input class="input" type="number" min="1" value="${e.sets}" oninput="eds[${i}].sets=+this.value"><input class="input" placeholder="Rep target" value="${esc(e.reps)}" oninput="eds[${i}].reps=this.value"></div><input class="input" placeholder="Notes, optional" value="${esc(e.notes||'')}" oninput="eds[${i}].notes=this.value"><button class="btn" onclick="eds.splice(${i},1);renderEditor()">Remove</button></div>`).join('')}function addExercise(){eds.push({id:uid(),name:'',sets:3,reps:'8-12',notes:''});renderEditor()}function saveRoutine(){let name=$('rname').value.trim(),ex=eds.filter(x=>x.name.trim());if(!name||!ex.length)return msg('Add a name and exercise');if(editing)d.routines[d.routines.findIndex(x=>x.id===editing)]={id:editing,name,exercises:ex};else d.routines.push({id:uid(),name,exercises:ex});save();closeM('routineModal');render()}function deleteRoutine(){if(confirm('Delete routine?')){d.routines=d.routines.filter(x=>x.id!==editing);save();closeM('routineModal');render()}}
function prev(n,i,k){for(const w of d.history){let e=w.exercises.find(x=>x.name.toLowerCase()===n.toLowerCase());if(e?.sets[i]?.[k])return e.sets[i][k]}return''}function start(id){let r=d.routines.find(x=>x.id===id);wo={id:uid(),routineId:id,name:r.name,started:Date.now(),exercises:r.exercises.map(e=>({name:e.name,target:e.reps,notes:e.notes,sets:Array.from({length:e.sets},()=>({weight:'',reps:'',done:false}))}))};drawWork();$('workModal').classList.add('show');tick=setInterval(()=>{$('timer').textContent=Math.floor((Date.now()-wo.started)/60000)+' min'},1000)}function drawWork(){$('wname').textContent=wo.name;$('work').innerHTML=wo.exercises.map((e,ei)=>`<div class="card exercise"><b>${esc(e.name)}</b><div class="muted">${esc(e.target)}${e.notes?' · '+esc(e.notes):''}</div>${e.sets.map((s,si)=>`<div class="set"><span>${si+1}</span><input class="input ${s.done?'done':''}" inputmode="decimal" placeholder="${prev(e.name,si,'weight')||'kg'}" value="${s.weight}" onchange="wo.exercises[${ei}].sets[${si}].weight=this.value"><input class="input ${s.done?'done':''}" inputmode="numeric" placeholder="${prev(e.name,si,'reps')||'reps'}" value="${s.reps}" onchange="wo.exercises[${ei}].sets[${si}].reps=this.value"><button class="icon ${s.done?'done':''}" onclick="toggle(${ei},${si})">${s.done?'✓':'○'}</button></div>`).join('')}<button class="btn" onclick="wo.exercises[${ei}].sets.push({weight:'',reps:'',done:false});drawWork()">+ Set</button></div>`).join('')}function toggle(e,s){wo.exercises[e].sets[s].done=!wo.exercises[e].sets[s].done;drawWork();if(wo.exercises[e].sets[s].done)rest()}function rest(){clearInterval(restTick);let n=d.rest;msg('Rest '+n+'s');restTick=setInterval(()=>{if(--n<=0){clearInterval(restTick);msg('Rest complete')}},1000)}function finish(){wo.duration=Math.round((Date.now()-wo.started)/1000);d.history.unshift(wo);save();clearInterval(tick);closeM('workModal');render();msg('Workout saved')}
function records(){let z={};d.history.forEach(w=>w.exercises.forEach(e=>e.sets.filter(s=>s.done).forEach(s=>{let k=e.name.toLowerCase(),wt=+s.weight||0,r=+s.reps||0;if(!z[k]||wt>z[k].wt)z[k]={name:e.name,wt,r,date:w.started}})));return Object.values(z)}function renderProgress(){let sets=d.history.reduce((a,w)=>a+w.exercises.reduce((b,e)=>b+e.sets.filter(s=>s.done).length,0),0);$('totals').innerHTML=`<div class="card stat"><b>${d.history.length}</b><span>WORKOUTS</span></div><div class="card stat"><b>${sets}</b><span>SETS</span></div><div class="card stat"><b>${Math.round(d.history.reduce((a,w)=>a+w.duration,0)/60)}</b><span>MINUTES</span></div>`;let names=[...new Set(d.history.flatMap(w=>w.exercises.map(e=>e.name)))];$('chartEx').innerHTML=names.map(x=>`<option>${esc(x)}</option>`).join('');chart();$('prs').innerHTML=records().map(x=>`<div class="card between"><b>${esc(x.name)}</b><span>${x.wt} kg × ${x.r}</span></div>`).join('')||'<div class="card muted">No records yet.</div>';$('history').innerHTML=d.history.map(w=>`<div class="card history between"><div><b>${esc(w.name)}</b><div class="muted">${new Date(w.started).toLocaleDateString()}</div></div><span>${Math.round(w.duration/60)} min</span></div>`).join('')||'<div class="card muted">No workouts yet.</div>'}function chart(){let c=$('chart'),ctx=c.getContext('2d'),n=$('chartEx').value,p=[];[...d.history].reverse().forEach(w=>{let e=w.exercises.find(x=>x.name===n);if(e){let y=Math.max(0,...e.sets.filter(s=>s.done).map(s=>+s.weight||0));if(y)p.push(y)}});ctx.clearRect(0,0,c.width,c.height);ctx.fillStyle=getComputedStyle(document.body).getPropertyValue('--card');ctx.fillRect(0,0,c.width,c.height);if(!p.length){ctx.fillStyle='#777';ctx.fillText('Log weighted sets to see progress',15,25);return}let min=Math.min(...p,0),max=Math.max(...p),pad=25;ctx.beginPath();ctx.strokeStyle='#16a34a';ctx.lineWidth=3;p.forEach((v,i)=>{let x=pad+(c.width-2*pad)*(p.length===1?.5:i/(p.length-1)),y=c.height-pad-(c.height-2*pad)*(v-min)/(max-min||1);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke()}
function renderSettings(){$('rest').value=d.rest;$('bwInfo').textContent=d.weights.length?'Latest: '+d.weights[0].v+' kg on '+new Date(d.weights[0].date).toLocaleDateString():'No entries yet';$('photos').innerHTML=d.photos.map((p,i)=>`<div><img src="${p.src}"><button class="btn" onclick="d.photos.splice(${i},1);save();renderSettings()">Delete</button></div>`).join('')}function saveWeight(){let v=+$('bw').value;if(!v)return;d.weights.unshift({v,date:Date.now()});save();$('bw').value='';render();renderSettings()}function saveRest(){d.rest=Math.max(10,+$('rest').value||90);save()}function dark(){d.dark=!d.dark;save();apply()}function apply(){document.body.classList.toggle('dark',d.dark)}function photo(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let c=document.createElement('canvas'),sc=Math.min(1,500/im.width);c.width=im.width*sc;c.height=im.height*sc;c.getContext('2d').drawImage(im,0,0,c.width,c.height);d.photos.unshift({src:c.toDataURL('image/jpeg',.65),date:Date.now()});d.photos=d.photos.slice(0,9);save();renderSettings()};im.src=r.result};r.readAsDataURL(f)}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d)],{type:'application/json'}));a.download='gym-plan-backup.json';a.click()}function importData(e){let r=new FileReader();r.onload=()=>{d=JSON.parse(r.result);save();location.reload()};r.readAsText(e.target.files[0])}apply();render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
