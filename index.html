<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f1115"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>My Gym Plan</title><style>
:root{--bg:#f4f5f7;--card:#fff;--text:#17191d;--muted:#68707b;--line:#e3e6ea;--green:#16a34a;--soft:#dcfce7;--red:#dc2626;--gold:#d97706}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;padding-bottom:88px}body.dark{--bg:#0f1115;--card:#191c22;--text:#f6f7f8;--muted:#a1a8b2;--line:#30343b;--soft:#153d25}.wrap{max-width:760px;margin:auto;padding:calc(16px + env(safe-area-inset-top)) 15px 24px}.row,.between{display:flex;align-items:center}.between{justify-content:space-between;gap:10px}.brand{font-size:22px;font-weight:900;margin-bottom:16px}.muted{font-size:12px;color:var(--muted)}h1{font-size:25px;margin:3px 0}h2{font-size:18px;margin:22px 2px 10px}h3{margin:0 0 5px;font-size:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:15px}.grid{display:grid;gap:9px}.quick{background:linear-gradient(135deg,#166534,#16a34a);color:#fff;border:0;margin:14px 0}.quick .muted{color:#dcfce7}.metric{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stat{text-align:center;padding:12px 5px}.stat b{display:block;font-size:19px}.stat span{font-size:10px;color:var(--muted)}.btn,.icon{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:11px;padding:10px 13px;font-weight:750}.primary{background:var(--green);border-color:var(--green);color:#fff}.danger{color:var(--red)}.icon{width:42px;padding:9px}.actions,.templates,.tabs,.presets{display:flex;gap:7px;overflow:auto}.templates button,.tabs button,.presets button{white-space:nowrap}.screen{display:none}.screen.active{display:block}.nav{position:fixed;bottom:0;left:0;right:0;min-height:76px;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:env(safe-area-inset-bottom);z-index:4}.nav button{border:0;background:none;color:var(--muted);font-size:14px;font-weight:800}.nav span{font-size:24px;display:block;line-height:25px}.nav button.on{color:var(--green)}.modal{display:none;position:fixed;inset:0;background:#0009;z-index:7;align-items:flex-end}.modal.show{display:flex}.sheet{background:var(--bg);width:100%;max-width:760px;max-height:94vh;overflow:auto;margin:auto;padding:17px;border-radius:22px 22px 0 0}.input{width:100%;padding:11px;border:1px solid var(--line);border-radius:11px;background:var(--card);color:var(--text);margin:5px 0 10px}.exercise{margin:9px 0}.set{display:grid;grid-template-columns:30px 1fr 1fr 42px;gap:6px;align-items:center;margin-top:7px}.set input{min-width:0;text-align:center}.done{background:var(--soft)!important}.sticky{position:sticky;top:0;background:var(--bg);padding-bottom:10px;z-index:2}.tabs button.on{background:var(--green);border-color:var(--green);color:#fff}canvas{width:100%;height:205px;background:var(--card);border-radius:12px}.toast,.undo{position:fixed;bottom:96px;background:#111;color:#fff;padding:11px 15px;border-radius:13px;z-index:12;display:none}.toast{left:50%;transform:translateX(-50%);border-radius:99px}.undo{left:14px;right:14px;max-width:500px;margin:auto}.undo button{float:right;background:none;border:0;color:#86efac;font-weight:900}.timerbox{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top));background:#111;color:#fff;padding:10px 13px;border-radius:13px;display:none;z-index:15}.pr{color:var(--gold);font-weight:850}.history-actions{display:flex;gap:5px}.history-actions .btn{padding:7px 9px;font-size:12px}.weight-row{margin-bottom:8px}.badge{font-size:11px;padding:3px 7px;border-radius:99px;background:var(--soft);color:#15803d}@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:22px}.metric{grid-template-columns:repeat(4,1fr)}}
</style></head><body><main class="wrap"><div class="brand">My Gym Plan</div>
<section id="plans" class="screen active"><div class="between"><div><div id="greet" class="muted"></div><h1>Ready to train?</h1></div><button class="icon" onclick="go('settings',2)">⚙</button></div><div id="quick"></div><h2>This week</h2><div id="week" class="metric"></div><div class="between"><h2>Your routines</h2><button class="btn" onclick="editRoutine()">+ New</button></div><div id="routines" class="grid"></div><h2>Templates</h2><div class="templates"><button class="btn" onclick="template('Push')">+ Push</button><button class="btn" onclick="template('Pull')">+ Pull</button><button class="btn" onclick="template('Legs')">+ Legs</button><button class="btn" onclick="template('Upper Body')">+ Upper</button><button class="btn" onclick="template('Lower Body')">+ Lower</button></div></section>
<section id="progress" class="screen"><h1>Progress</h1><h2>Weight trend</h2><div class="card"><div class="tabs" id="ranges"><button class="btn on" onclick="setRange('1m',this)">1M</button><button class="btn" onclick="setRange('3m',this)">3M</button><button class="btn" onclick="setRange('6m',this)">6M</button><button class="btn" onclick="setRange('1y',this)">1Y</button><button class="btn" onclick="setRange('all',this)">All</button></div><div id="weightChange" class="between"></div><canvas id="weightChart" width="680" height="205"></canvas></div><h2>Exercise progress</h2><div class="card"><select id="chartEx" class="input" onchange="renderExercise()"></select><div id="exStats" class="metric"></div><canvas id="exChart" width="680" height="205"></canvas><div id="exHistory" class="grid"></div></div><h2>Lifetime statistics</h2><div id="lifetime" class="metric"></div><h2>Personal records</h2><div id="prs" class="grid"></div><h2>Workout history</h2><div id="history" class="grid"></div></section>
<section id="settings" class="screen"><h1>Settings</h1><h2>Body weight</h2><div class="card"><div class="row" style="gap:7px"><input id="bw" class="input" type="number" step=".1" placeholder="Weight in kg"><input id="bwDate" class="input" type="date"><button class="btn primary" onclick="addWeight()">Save</button></div></div><div id="weightEntries" class="grid" style="margin-top:9px"></div><h2>Rest timer</h2><div class="card"><div class="presets"><button class="btn" onclick="setRest(30)">30s</button><button class="btn" onclick="setRest(60)">60s</button><button class="btn" onclick="setRest(90)">90s</button><button class="btn" onclick="setRest(120)">120s</button><button class="btn" onclick="setRest(180)">180s</button></div><input id="customRest" class="input" type="number" placeholder="Custom seconds"><button class="btn" onclick="setRest(+customRest.value)">Use custom</button><div id="restInfo" class="muted"></div></div><h2>Data</h2><div class="card"><button class="btn" onclick="toggleDark()">Dark mode</button> <button class="btn" onclick="exportJSON()">Export JSON</button> <button class="btn" onclick="exportCSV()">Export CSV</button> <button class="btn" onclick="imp.click()">Import</button><input id="imp" hidden type="file" accept="application/json" onchange="importData(event)"></div></section></main>
<nav class="nav"><button class="on" onclick="go('plans',0)"><span>⌂</span>Plans</button><button onclick="go('progress',1)"><span>↗</span>Progress</button><button onclick="go('settings',2)"><span>⚙</span>Settings</button></nav>
<div id="routineModal" class="modal"><div class="sheet"><h1>Routine</h1><input id="rname" class="input" placeholder="Routine name"><div id="editor"></div><button class="btn" onclick="addExercise()">+ Exercise</button><div class="between" style="margin-top:14px"><button class="btn" onclick="closeM('routineModal')">Cancel</button><button id="delRoutine" class="btn danger" onclick="deleteRoutine()">Delete</button><button class="btn primary" onclick="saveRoutine()">Save</button></div></div></div>
<div id="workModal" class="modal"><div class="sheet"><div class="sticky between"><div><h1 id="wname"></h1><b id="workTimer">00:00</b></div><button class="btn primary" onclick="finishWorkout()">Finish</button></div><textarea id="workNotes" class="input" placeholder="Workout notes" oninput="wo.notes=this.value;autoSave()"></textarea><div id="work"></div></div></div>
<div id="editWorkoutModal" class="modal"><div class="sheet"><h1>Edit workout</h1><label class="muted">Workout name</label><input id="ewName" class="input"><label class="muted">Date and time</label><input id="ewDate" class="input" type="datetime-local"><label class="muted">Duration in minutes</label><input id="ewDuration" class="input" type="number"><label class="muted">Notes</label><textarea id="ewNotes" class="input"></textarea><div id="ewExercises"></div><div class="between"><button class="btn" onclick="closeM('editWorkoutModal')">Cancel</button><button class="btn primary" onclick="saveWorkoutEdit()">Save changes</button></div></div></div>
<div id="editWeightModal" class="modal"><div class="sheet"><h1>Edit weight</h1><input id="editWeightValue" class="input" type="number" step=".1"><input id="editWeightDate" class="input" type="date"><div class="between"><button class="btn" onclick="closeM('editWeightModal')">Cancel</button><button class="btn primary" onclick="saveWeightEdit()">Save</button></div></div></div>
<div id="toast" class="toast"></div><div id="undo" class="undo"><span id="undoText"></span><button onclick="undoAction()">UNDO</button></div><div id="restTimer" class="timerbox"></div>
<script>
const K='gymAppV31',$=x=>document.getElementById(x),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2);let d=JSON.parse(localStorage.getItem(K)||'null')||{routines:[],history:[],weights:[],rest:90,dark:true,active:null},editing=null,eds=[],wo=null,workTick,restTick,range='1m',pending=null,undoTick,editW=null,editWeight=null;const save=()=>localStorage.setItem(K,JSON.stringify(d)),esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function msg(x){$('toast').textContent=x;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',1500)}function go(id,i){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('.nav button').forEach((x,n)=>x.classList.toggle('on',n===i));if(id==='progress')renderProgress();if(id==='settings')renderSettings()}function closeM(x){$(x).classList.remove('show')}function autoSave(){if(wo){d.active=wo;save()}}function showUndo(text,obj){pending=obj;$('undoText').textContent=text;$('undo').style.display='block';clearTimeout(undoTick);undoTick=setTimeout(()=>{pending=null;$('undo').style.display='none'},10000)}function undoAction(){if(!pending)return;if(pending.type==='routine')d.routines.splice(pending.i,0,pending.item);if(pending.type==='workout')d.history.splice(pending.i,0,pending.item);if(pending.type==='weight')d.weights.splice(pending.i,0,pending.item);pending=null;save();$('undo').style.display='none';renderHome();renderProgress();renderSettings();msg('Restored')}
const T={Push:[['Bench Press',3,'6-10'],['Incline Press',3,'8-12'],['Shoulder Press',3,'8-12'],['Lateral Raise',3,'12-15'],['Triceps Pushdown',3,'10-15']],Pull:[['Pull-Up / Lat Pulldown',3,'8-12'],['Row',3,'8-12'],['Face Pull',3,'12-15'],['Biceps Curl',3,'8-12']],Legs:[['Squat',3,'6-10'],['Romanian Deadlift',3,'8-12'],['Leg Press',3,'10-15'],['Leg Curl',3,'10-15'],['Calf Raise',4,'10-15']],"Upper Body":[['Bench Press',3,'6-10'],['Incline Press',3,'8-12'],['Pull-Up / Lat Pulldown',3,'8-12'],['Row',3,'8-12'],['Shoulder Press',3,'8-12'],['Biceps Curl',3,'10-12'],['Triceps Pushdown',3,'10-12']],"Lower Body":[['Squat',3,'6-10'],['Romanian Deadlift',3,'8-12'],['Leg Press',3,'10-15'],['Leg Curl',3,'10-15'],['Leg Extension',3,'10-15'],['Calf Raise',4,'10-15'],['Abs',3,'12-20']]};
const volume=w=>w.exercises.reduce((a,e)=>a+e.sets.filter(s=>s.done).reduce((b,s)=>b+(+s.weight||0)*(+s.reps||0),0),0),sets=w=>w.exercises.reduce((a,e)=>a+e.sets.filter(s=>s.done).length,0);function weekStart(){let x=new Date();x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return+x}function template(n){if(d.routines.some(x=>x.name===n))return msg('Already added');d.routines.push({id:uid(),name:n,exercises:T[n].map(x=>({id:uid(),name:x[0],sets:x[1],reps:x[2],notes:''}))});save();renderHome()}
function renderHome(){let h=new Date().getHours();$('greet').textContent=h<12?'Good morning':h<18?'Good afternoon':'Good evening';let last=d.history[0],valid=last&&d.routines.find(x=>x.id===last.routineId);$('quick').innerHTML=`<div class="card quick between"><div><div class="muted">${d.active?'RESUME WORKOUT':valid?'START LAST WORKOUT':'QUICK START'}</div><b>${d.active?esc(d.active.name):valid?esc(last.name):'Choose or create a routine'}</b></div><button class="btn" onclick="${d.active?'resumeWorkout()':valid?`startWorkout('${last.routineId}')`:'editRoutine()'}">${d.active?'Resume':valid?'Start':'Create'}</button></div>`;let w=d.history.filter(x=>x.started>=weekStart());$('week').innerHTML=`<div class="card stat"><b>${w.length}</b><span>WORKOUTS</span></div><div class="card stat"><b>${Math.round(w.reduce((a,x)=>a+x.duration,0)/60)}</b><span>MINUTES</span></div><div class="card stat"><b>${w.reduce((a,x)=>a+sets(x),0)}</b><span>SETS</span></div><div class="card stat"><b>${Math.round(w.reduce((a,x)=>a+volume(x),0)).toLocaleString()}</b><span>KG VOLUME</span></div>`;$('routines').innerHTML=d.routines.length?d.routines.map(r=>`<div class="card between"><div><h3>${esc(r.name)}</h3><div class="muted">${r.exercises.length} exercises</div></div><div class="actions"><button class="icon" onclick="editRoutine('${r.id}')">✎</button><button class="btn primary" onclick="startWorkout('${r.id}')">Start</button></div></div>`).join(''):'<div class="card muted">No routines yet.</div>'}
function editRoutine(id){editing=id||null;let r=d.routines.find(x=>x.id===id);$('rname').value=r?.name||'';eds=r?structuredClone(r.exercises):[{id:uid(),name:'',sets:3,reps:'8-12',notes:''}];$('delRoutine').style.display=r?'block':'none';renderEditor();$('routineModal').classList.add('show')}function renderEditor(){$('editor').innerHTML=eds.map((e,i)=>`<div class="card exercise"><input class="input" value="${esc(e.name)}" placeholder="Exercise" oninput="eds[${i}].name=this.value"><div class="row" style="gap:7px"><input class="input" type="number" value="${e.sets}" oninput="eds[${i}].sets=+this.value"><input class="input" value="${esc(e.reps)}" placeholder="Rep target" oninput="eds[${i}].reps=this.value"></div><input class="input" value="${esc(e.notes||'')}" placeholder="Notes" oninput="eds[${i}].notes=this.value"><button class="btn" onclick="eds.splice(${i},1);renderEditor()">Remove</button></div>`).join('')}function addExercise(){eds.push({id:uid(),name:'',sets:3,reps:'8-12',notes:''});renderEditor()}function saveRoutine(){let name=$('rname').value.trim(),ex=eds.filter(x=>x.name.trim());if(!name||!ex.length)return msg('Add name and exercise');let r={id:editing||uid(),name,exercises:ex};if(editing)d.routines[d.routines.findIndex(x=>x.id===editing)]=r;else d.routines.push(r);save();closeM('routineModal');renderHome()}function deleteRoutine(){let i=d.routines.findIndex(x=>x.id===editing);if(i<0||!confirm('Delete this routine?'))return;let item=d.routines.splice(i,1)[0];save();closeM('routineModal');renderHome();showUndo('Routine deleted',{type:'routine',item,i})}
function sessions(name){let a=[];d.history.forEach(w=>{let e=w.exercises.find(x=>x.name.toLowerCase()===name.toLowerCase());if(e){let s=e.sets.filter(x=>x.done),best=[...s].sort((a,b)=>(+b.weight||0)-(+a.weight||0))[0];a.push({date:w.started,max:Math.max(0,...s.map(x=>+x.weight||0)),reps:s.reduce((a,x)=>a+(+x.reps||0),0),sets:s.length,volume:s.reduce((a,x)=>a+(+x.weight||0)*(+x.reps||0),0),best})}});return a}function summary(n){let a=sessions(n);if(!a.length)return{last:'None',best:'None'};let best=a.reduce((x,y)=>y.max>x.max?y:x,a[0]);return{last:a[0].best?`${a[0].best.weight}kg × ${a[0].best.reps}`:'None',best:best.best?`${best.best.weight}kg × ${best.best.reps}`:'None'}}function startWorkout(id){let r=d.routines.find(x=>x.id===id);wo={id:uid(),routineId:id,name:r.name,started:Date.now(),notes:'',exercises:r.exercises.map(e=>({name:e.name,target:e.reps,notes:e.notes,sets:Array.from({length:e.sets},()=>({weight:'',reps:'',done:false}))}))};autoSave();openWorkout()}function resumeWorkout(){wo=d.active;openWorkout()}function openWorkout(){$('wname').textContent=wo.name;$('workNotes').value=wo.notes||'';drawWorkout();$('workModal').classList.add('show');clearInterval(workTick);updateTimer();workTick=setInterval(updateTimer,1000)}function updateTimer(){let s=Math.floor((Date.now()-wo.started)/1000);$('workTimer').textContent=`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}function drawWorkout(){$('work').innerHTML=wo.exercises.map((e,ei)=>{let p=summary(e.name);return`<div class="card exercise"><h3>${esc(e.name)}</h3><div class="muted">Last: ${p.last} · Best: ${p.best}</div>${e.sets.map((s,si)=>`<div class="set"><span>${si+1}</span><input class="input ${s.done?'done':''}" value="${esc(s.weight)}" placeholder="kg" oninput="wo.exercises[${ei}].sets[${si}].weight=this.value;autoSave()"><input class="input ${s.done?'done':''}" value="${esc(s.reps)}" placeholder="reps" oninput="wo.exercises[${ei}].sets[${si}].reps=this.value;autoSave()"><button class="icon ${s.done?'done':''}" onclick="toggleSet(${ei},${si})">${s.done?'✓':'○'}</button></div>`).join('')}<button class="btn" onclick="wo.exercises[${ei}].sets.push({weight:'',reps:'',done:false});autoSave();drawWorkout()">+ Set</button></div>`}).join('')}function toggleSet(e,s){let x=wo.exercises[e].sets[s];x.done=!x.done;autoSave();drawWorkout();if(x.done)startRest(d.rest)}function finishWorkout(){wo.duration=Math.round((Date.now()-wo.started)/1000);d.history.unshift(wo);d.active=null;save();wo=null;clearInterval(workTick);closeM('workModal');renderHome();msg('Workout saved')}
function startRest(n){clearInterval(restTick);let left=n;$('restTimer').style.display='block';let f=()=>{$('restTimer').textContent=`Rest ${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;if(left--<=0){clearInterval(restTick);$('restTimer').style.display='none';msg('Rest complete')}};f();restTick=setInterval(f,1000)}function setRest(n){if(!n||n<1)return;d.rest=n;save();renderSettings();msg('Rest set')}
function renderHistory(){$('history').innerHTML=d.history.length?d.history.map((w,i)=>`<div class="card between"><div><b>${esc(w.name)}</b><div class="muted">${new Date(w.started).toLocaleString()} · ${Math.round(w.duration/60)} min · ${sets(w)} sets</div></div><div class="history-actions"><button class="btn" onclick="editWorkout(${i})">Edit</button><button class="btn danger" onclick="deleteWorkout(${i})">Delete</button></div></div>`).join(''):'<div class="card muted">No workouts yet.</div>'}function deleteWorkout(i){if(!confirm('Delete this workout? PRs and statistics will be recalculated.'))return;let item=d.history.splice(i,1)[0];save();renderProgress();renderHome();showUndo('Workout deleted',{type:'workout',item,i})}function editWorkout(i){editW=i;let w=d.history[i];$('ewName').value=w.name;$('ewDate').value=new Date(w.started-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16);$('ewDuration').value=Math.round(w.duration/60);$('ewNotes').value=w.notes||'';$('ewExercises').innerHTML=w.exercises.map((e,ei)=>`<div class="card exercise"><h3>${esc(e.name)}</h3>${e.sets.map((s,si)=>`<div class="set"><span>${si+1}</span><input class="input" value="${esc(s.weight)}" placeholder="kg" oninput="d.history[${i}].exercises[${ei}].sets[${si}].weight=this.value"><input class="input" value="${esc(s.reps)}" placeholder="reps" oninput="d.history[${i}].exercises[${ei}].sets[${si}].reps=this.value"><button class="icon ${s.done?'done':''}" onclick="d.history[${i}].exercises[${ei}].sets[${si}].done=!d.history[${i}].exercises[${ei}].sets[${si}].done;editWorkout(${i})">${s.done?'✓':'○'}</button></div>`).join('')}</div>`).join('');$('editWorkoutModal').classList.add('show')}function saveWorkoutEdit(){let w=d.history[editW];w.name=$('ewName').value.trim()||w.name;w.started=+new Date($('ewDate').value);w.duration=Math.max(0,+$('ewDuration').value*60||0);w.notes=$('ewNotes').value;save();closeM('editWorkoutModal');renderProgress();renderHome();msg('Workout updated')}
function addWeight(){let v=+$('bw').value,date=$('bwDate').value?+new Date($('bwDate').value+'T12:00'):Date.now();if(!v)return msg('Enter weight');d.weights.push({v,date,id:uid()});sortWeights();save();$('bw').value='';renderSettings()}function sortWeights(){d.weights.sort((a,b)=>b.date-a.date)}function renderWeights(){$('weightEntries').innerHTML=d.weights.length?d.weights.map((x,i)=>`<div class="card weight-row between"><div><b>${x.v} kg</b><div class="muted">${new Date(x.date).toLocaleDateString()}</div></div><div class="history-actions"><button class="btn" onclick="editWeightEntry(${i})">Edit</button><button class="btn danger" onclick="deleteWeight(${i})">Delete</button></div></div>`).join(''):'<div class="card muted">No weight entries yet.</div>'}function editWeightEntry(i){editWeight=i;let x=d.weights[i];$('editWeightValue').value=x.v;$('editWeightDate').value=new Date(x.date-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);$('editWeightModal').classList.add('show')}function saveWeightEdit(){let x=d.weights[editWeight],v=+$('editWeightValue').value;if(!v)return msg('Enter weight');x.v=v;x.date=+new Date($('editWeightDate').value+'T12:00');sortWeights();save();closeM('editWeightModal');renderSettings();msg('Weight updated')}function deleteWeight(i){if(!confirm('Delete this weight entry?'))return;let item=d.weights.splice(i,1)[0];save();renderSettings();showUndo('Weight entry deleted',{type:'weight',item,i})}
function setRange(r,b){range=r;document.querySelectorAll('#ranges button').forEach(x=>x.classList.remove('on'));b.classList.add('on');weightChart()}function filteredWeights(){let days={"1m":30,"3m":90,"6m":180,"1y":365,all:99999}[range],cut=Date.now()-days*86400000;return d.weights.filter(x=>x.date>=cut).sort((a,b)=>a.date-b.date)}function lineChart(id,a,key,label){let c=$(id),x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);x.fillStyle=getComputedStyle(document.body).getPropertyValue('--card');x.fillRect(0,0,c.width,c.height);if(!a.length){x.fillStyle='#777';x.fillText('Not enough data yet',18,28);return}let v=a.map(p=>p[key]),min=Math.min(...v),max=Math.max(...v);if(min===max){min--;max++}let p=30;x.strokeStyle='#16a34a';x.lineWidth=3;x.beginPath();a.forEach((q,i)=>{let px=p+(c.width-2*p)*(a.length===1?.5:i/(a.length-1)),py=c.height-p-(c.height-2*p)*(q[key]-min)/(max-min);i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke()}function weightChart(){let a=filteredWeights(),ch=a.length>1?a.at(-1).v-a[0].v:0;$('weightChange').innerHTML=`<b>${a.length?a.at(-1).v+' kg':'No data'}</b><span>${ch>0?'↑':ch<0?'↓':'→'} ${Math.abs(ch).toFixed(1)} kg</span>`;lineChart('weightChart',a,'v','kg')}function e1rm(w,r){return r?Math.round(w*(1+r/30)*10)/10:0}function records(){let z={};d.history.forEach(w=>w.exercises.forEach(e=>e.sets.filter(s=>s.done).forEach(s=>{let wt=+s.weight||0,r=+s.reps||0,k=e.name.toLowerCase();if(wt&&(!z[k]||e1rm(wt,r)>e1rm(z[k].w,z[k].r)))z[k]={name:e.name,w:wt,r}})));return Object.values(z)}function streak(){let a=[...new Set(d.history.map(x=>new Date(x.started).toDateString()))].map(x=>+new Date(x)).sort((a,b)=>a-b),best=a.length?1:0,cur=best;for(let i=1;i<a.length;i++){cur=Math.round((a[i]-a[i-1])/86400000)===1?cur+1:1;best=Math.max(best,cur)}return best}
function renderProgress(){weightChart();let names=[...new Set(d.history.flatMap(w=>w.exercises.map(e=>e.name)))],s=$('chartEx'),old=s.value;s.innerHTML=names.map(x=>`<option>${esc(x)}</option>`).join('');if(names.includes(old))s.value=old;renderExercise();$('lifetime').innerHTML=`<div class="card stat"><b>${d.history.length}</b><span>WORKOUTS</span></div><div class="card stat"><b>${(d.history.reduce((a,w)=>a+w.duration,0)/3600).toFixed(1)}</b><span>HOURS</span></div><div class="card stat"><b>${Math.round(d.history.reduce((a,w)=>a+volume(w),0)).toLocaleString()}</b><span>KG LIFTED</span></div><div class="card stat"><b>${streak()}</b><span>STREAK</span></div>`;$('prs').innerHTML=records().map(x=>`<div class="card between"><b>${esc(x.name)}</b><span class="pr">${x.w} kg × ${x.r} · 1RM ${e1rm(x.w,x.r)}</span></div>`).join('')||'<div class="card muted">No records yet.</div>';renderHistory()}function renderExercise(){let a=sessions($('chartEx').value).reverse(),l=a.at(-1);$('exStats').innerHTML=l?`<div class="card stat"><b>${l.max}</b><span>MAX KG</span></div><div class="card stat"><b>${l.reps}</b><span>REPS</span></div><div class="card stat"><b>${l.sets}</b><span>SETS</span></div><div class="card stat"><b>${Math.round(l.volume)}</b><span>VOLUME</span></div>`:'';lineChart('exChart',a,'max','kg');$('exHistory').innerHTML=[...a].reverse().slice(0,10).map(x=>`<div class="card between"><span>${new Date(x.date).toLocaleDateString()}</span><span>${x.max} kg · ${x.sets} sets · ${Math.round(x.volume)} vol</span></div>`).join('')}
function renderSettings(){$('restInfo').textContent='Current: '+d.rest+' seconds';if(!$('bwDate').value)$('bwDate').value=new Date().toISOString().slice(0,10);renderWeights()}function toggleDark(){d.dark=!d.dark;save();apply()}function apply(){document.body.classList.toggle('dark',d.dark)}function download(n,t,m){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click()}function exportJSON(){download('gym-plan-backup.json',JSON.stringify(d,null,2),'application/json')}function exportCSV(){let r=[['Date','Workout','Duration minutes','Exercise','Weight','Reps','Volume','Notes']];d.history.forEach(w=>w.exercises.forEach(e=>e.sets.filter(s=>s.done).forEach(s=>r.push([new Date(w.started).toISOString(),w.name,Math.round(w.duration/60),e.name,s.weight,s.reps,(+s.weight||0)*(+s.reps||0),w.notes||'']))));download('gym-workouts.csv',r.map(x=>x.map(y=>'"'+String(y).replaceAll('"','""')+'"').join(',')).join('\n'),'text/csv')}function importData(e){let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.routines||!x.history)throw 0;d=x;save();location.reload()}catch{msg('Invalid backup')}};r.readAsText(e.target.files[0])}
apply();renderHome();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
