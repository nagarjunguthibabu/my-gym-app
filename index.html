</style></head><body><main class="wrap"><div class="top"><div class="brand">My Gym Plan</div></div>
<section id="plans" class="screen active"><div class="between"><div><div id="greet" class="muted"></div><h1>Ready to train?</h1></div><button class="icon" onclick="go('settings',2)">⚙</button></div><div id="quick"></div><h2>This week</h2><div class="metric" id="weekDash"></div><div class="between"><h2>Your routines</h2><button class="btn" onclick="editRoutine()">+ New</button></div><div id="routines" class="grid"></div><h2>Templates</h2><div class="templates"><button class="btn" onclick="template('Push')">+ Push</button><button class="btn" onclick="template('Pull')">+ Pull</button><button class="btn" onclick="template('Legs')">+ Legs</button><button class="btn" onclick="template('Upper Body')">+ Upper Body</button><button class="btn" onclick="template('Lower Body')">+ Lower Body</button></div></section>
<section id="progress" class="screen"><h1>Progress</h1><h2>Weight trend</h2><div class="card"><div class="tabs" id="weightTabs"><button class="btn on" onclick="setWeightRange('1m',this)">1M</button><button class="btn" onclick="setWeightRange('3m',this)">3M</button><button class="btn" onclick="setWeightRange('6m',this)">6M</button><button class="btn" onclick="setWeightRange('1y',this)">1Y</button><button class="btn" onclick="setWeightRange('all',this)">All</button></div><div id="weightChange" class="between"></div><canvas id="weightChart" width="680" height="210"></canvas></div><h2>Exercise progress</h2><div class="card"><select id="chartEx" class="input" onchange="renderExercise()"></select><div id="exSummary" class="metric"></div><canvas id="exChart" width="680" height="210"></canvas><div id="exHistory" class="grid"></div></div><h2>Lifetime statistics</h2><div id="lifetime" class="metric"></div><h2>Personal records</h2><div id="prs" class="grid"></div></section>
<section id="settings" class="screen"><h1>Settings</h1><h2>Body weight</h2><div class="card"><div class="row" style="gap:7px"><input id="bw" class="input" type="number" step=".1" placeholder="Weight in kg"><button class="btn primary" onclick="saveWeight()">Save</button></div><div id="bwInfo" class="muted"></div></div><h2>Goals</h2><div class="card"><label class="muted">Weight goal (kg)</label><input id="goalWeight" class="input" type="number" step=".1"><label class="muted">Workouts per week</label><input id="goalFreq" class="input" type="number" min="1"><label class="muted">Strength goal exercise</label><input id="goalExercise" class="input" placeholder="e.g. Bench Press"><label class="muted">Target weight (kg)</label><input id="goalStrength" class="input" type="number"><button class="btn primary" onclick="saveGoals()">Save goals</button><div id="goalView" style="margin-top:12px"></div></div><h2>Rest timer</h2><div class="card"><div class="presets"><button class="btn" onclick="setRest(30)">30s</button><button class="btn" onclick="setRest(60)">60s</button><button class="btn" onclick="setRest(90)">90s</button><button class="btn" onclick="setRest(120)">120s</button><button class="btn" onclick="setRest(180)">180s</button></div><input id="customRest" class="input" type="number" placeholder="Custom seconds"><button class="btn" onclick="setRest(+customRest.value)">Use custom</button><div id="restInfo" class="muted"></div></div><h2>Preferences and data</h2><div class="card"><button class="btn" onclick="toggleDark()">Toggle dark mode</button> <button class="btn" onclick="exportJSON()">Export JSON</button> <button class="btn" onclick="exportCSV()">Export CSV</button> <button class="btn" onclick="imp.click()">Import</button><input id="imp" hidden type="file" accept="application/json" onchange="importData(event)"></div></section></main>
<nav class="nav"><button class="on" onclick="go('plans',0)"><span>⌂</span>Plans</button><button onclick="go('progress',1)"><span>↗</span>Progress</button><button onclick="go('settings',2)"><span>⚙</span>Settings</button></nav>
<div id="routineModal" class="modal"><div class="sheet"><h1>Routine</h1><input id="rname" class="input" placeholder="Routine name"><div id="editor"></div><button class="btn" onclick="addExercise()">+ Exercise</button><div class="between" style="margin-top:15px"><button class="btn" onclick="closeM('routineModal')">Cancel</button><button id="delBtn" class="btn danger" onclick="deleteRoutine()">Delete</button><button class="btn primary" onclick="saveRoutine()">Save</button></div></div></div>
<div id="workModal" class="modal"><div class="sheet"><div class="sticky between"><div><h1 id="wname"></h1><b id="workTimer">00:00</b></div><button class="btn primary" onclick="finishWorkout()">Finish</button></div><label class="muted">Workout notes</label><textarea id="workNotes" class="input" oninput="wo.notes=this.value;autoSave()"></textarea><div id="work"></div></div></div><div id="toast" class="toast"></div><div id="undo" class="undo">Routine deleted <button onclick="undoDelete()">UNDO</button></div><div id="restTimer" class="timerbox"></div>
<script>
const K='gymAppV3',uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2),$=x=>document.getElementById(x);let d=JSON.parse(localStorage.getItem(K)||'null')||{routines:[],history:[],weights:[],rest:90,dark:true,goals:{weight:'',freq:3,exercise:'',strength:''},active:null},editing=null,eds=[],wo=null,workTick,restTick,weightRange='1m',deleted=null,undoTick;const save=()=>localStorage.setItem(K,JSON.stringify(d)),esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function msg(x){$('toast').textContent=x;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',1600)}function go(id,i){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('.nav button').forEach((x,n)=>x.classList.toggle('on',i===n));if(id==='progress')renderProgress();if(id==='settings')renderSettings()}function closeM(x){$(x).classList.remove('show')}function autoSave(){if(wo){d.active=wo;save()}}
const T={Push:[['Bench Press',3,'6-10'],['Incline Press',3,'8-12'],['Shoulder Press',3,'8-12'],['Lateral Raise',3,'12-15'],['Triceps Pushdown',3,'10-15']],Pull:[['Pull-Up / Lat Pulldown',3,'8-12'],['Row',3,'8-12'],['Face Pull',3,'12-15'],['Biceps Curl',3,'8-12']],Legs:[['Squat',3,'6-10'],['Romanian Deadlift',3,'8-12'],['Leg Press',3,'10-15'],['Leg Curl',3,'10-15'],['Calf Raise',4,'10-15']],"Upper Body":[['Bench Press',3,'6-10'],['Incline Press',3,'8-12'],['Pull-Up / Lat Pulldown',3,'8-12'],['Row',3,'8-12'],['Shoulder Press',3,'8-12'],['Biceps Curl',3,'10-12'],['Triceps Pushdown',3,'10-12']],"Lower Body":[['Squat',3,'6-10'],['Romanian Deadlift',3,'8-12'],['Leg Press',3,'10-15'],['Leg Curl',3,'10-15'],['Leg Extension',3,'10-15'],['Calf Raise',4,'10-15'],['Abs',3,'12-20']]};
function template(n){if(d.routines.some(x=>x.name===n))return msg('Template already added');d.routines.push({id:uid(),name:n,exercises:T[n].map(x=>({id:uid(),name:x[0],sets:x[1],reps:x[2],notes:''}))});save();renderHome();msg(n+' added')}
function weekStart(){let x=new Date();x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return +x}function workoutVolume(w){return w.exercises.reduce((a,e)=>a+e.sets.filter(s=>s.done).reduce((b,s)=>b+(+s.weight||0)*(+s.reps||0),0),0)}function completedSets(w){return w.exercises.reduce((a,e)=>a+e.sets.filter(s=>s.done).length,0)}
function renderHome(){let h=new Date().getHours();$('greet').textContent=h<12?'Good morning':h<18?'Good afternoon':'Good evening';let last=d.history[0],valid=last&&d.routines.find(x=>x.id===last.routineId);$('quick').innerHTML=`<div class="card quick between"><div><div class="muted">${valid?'START LAST WORKOUT':d.active?'RESUME WORKOUT':'QUICK START'}</div><b>${d.active?esc(d.active.name):valid?esc(last.name):d.routines.length?'Choose a routine below':'Create your first routine'}</b></div><button class="btn" onclick="${d.active?'resumeWorkout()':valid?`startWorkout('${last.routineId}')`:'editRoutine()'}">${d.active?'Resume':valid?'Start':'Create'}</button></div>`;let ws=weekStart(),w=d.history.filter(x=>x.started>=ws),dur=w.reduce((a,x)=>a+x.duration,0),sets=w.reduce((a,x)=>a+completedSets(x),0),vol=w.reduce((a,x)=>a+workoutVolume(x),0);$('weekDash').innerHTML=`<div class="card stat"><b>${w.length}</b><span>WORKOUTS</span></div><div class="card stat"><b>${Math.round(dur/60)}</b><span>MINUTES</span></div><div class="card stat"><b>${sets}</b><span>SETS</span></div><div class="card stat"><b>${Math.round(vol).toLocaleString()}</b><span>KG VOLUME</span></div>`;$('routines').innerHTML=d.routines.length?d.routines.map(r=>`<div class="card between"><div><h3>${esc(r.name)}</h3><div class="muted">${r.exercises.length} exercises · ${r.exercises.reduce((a,e)=>a+e.sets,0)} sets</div></div><div class="actions"><button class="icon" onclick="editRoutine('${r.id}')">✎</button><button class="btn primary" onclick="startWorkout('${r.id}')">Start</button></div></div>`).join(''):'<div class="card muted">No routines yet. Add a template or create your own.</div>'}
function editRoutine(id){editing=id||null;let r=d.routines.find(x=>x.id===id);$('rname').value=r?r.name:'';eds=r?structuredClone(r.exercises):[{id:uid(),name:'',sets:3,reps:'8-12',notes:''}];$('delBtn').style.display=r?'block':'none';renderEditor();$('routineModal').classList.add('show')}function renderEditor(){$('editor').innerHTML=eds.map((e,i)=>`<div class="card exercise"><input class="input" placeholder="Exercise" value="${esc(e.name)}" oninput="eds[${i}].name=this.value"><div class="row" style="gap:7px"><input class="input" type="number" min="1" value="${e.sets}" oninput="eds[${i}].sets=+this.value"><input class="input" placeholder="Rep target" value="${esc(e.reps)}" oninput="eds[${i}].reps=this.value"></div><input class="input" placeholder="Exercise notes" value="${esc(e.notes||'')}" oninput="eds[${i}].notes=this.value"><button class="btn" onclick="eds.splice(${i},1);renderEditor()">Remove</button></div>`).join('')}function addExercise(){eds.push({id:uid(),name:'',sets:3,reps:'8-12',notes:''});renderEditor()}function saveRoutine(){let name=$('rname').value.trim(),ex=eds.filter(x=>x.name.trim());if(!name||!ex.length)return msg('Add a name and exercise');let r={id:editing||uid(),name,exercises:ex};if(editing)d.routines[d.routines.findIndex(x=>x.id===editing)]=r;else d.routines.push(r);save();closeM('routineModal');renderHome()}function deleteRoutine(){let i=d.routines.findIndex(x=>x.id===editing);if(i<0||!confirm('Delete this routine? You can undo for 10 seconds.'))return;deleted={r:d.routines[i],i};d.routines.splice(i,1);save();closeM('routineModal');renderHome();$('undo').style.display='block';clearTimeout(undoTick);undoTick=setTimeout(()=>{deleted=null;$('undo').style.display='none'},10000)}function undoDelete(){if(!deleted)return;d.routines.splice(deleted.i,0,deleted.r);deleted=null;save();$('undo').style.display='none';renderHome();msg('Routine restored')}
function exSessions(name){let a=[];d.history.forEach(w=>{let e=w.exercises.find(x=>x.name.toLowerCase()===name.toLowerCase());if(e){let sets=e.sets.filter(s=>s.done),max=Math.max(0,...sets.map(s=>+s.weight||0)),reps=sets.reduce((x,s)=>x+(+s.reps||0),0),volume=sets.reduce((x,s)=>x+(+s.weight||0)*(+s.reps||0),0),best=sets.sort((a,b)=>(+b.weight||0)-(+a.weight||0))[0];a.push({date:w.started,max,reps,sets:sets.length,volume,best})}});return a}function previousSummary(name){let a=exSessions(name);if(!a.length)return{last:'None',best:'None'};let l=a[0],best=a.reduce((x,y)=>y.max>x.max?y:x,a[0]);return{last:l.best?`${l.best.weight||0}kg × ${l.best.reps||0}`:'None',best:best.best?`${best.best.weight||0}kg × ${best.best.reps||0}`:'None'}}function estimated1RM(w,r){return r?Math.round(w*(1+r/30)*10)/10:0}
function startWorkout(id){let r=d.routines.find(x=>x.id===id);wo={id:uid(),routineId:id,name:r.name,started:Date.now(),notes:'',exercises:r.exercises.map(e=>({name:e.name,target:e.reps,notes:e.notes,sets:Array.from({length:e.sets},()=>({weight:'',reps:'',done:false}))}))};autoSave();openWorkout()}function resumeWorkout(){wo=d.active;openWorkout()}function openWorkout(){$('wname').textContent=wo.name;$('workNotes').value=wo.notes||'';drawWorkout();$('workModal').classList.add('show');clearInterval(workTick);updateWorkTimer();workTick=setInterval(updateWorkTimer,1000)}function updateWorkTimer(){let s=Math.floor((Date.now()-wo.started)/1000);$('workTimer').textContent=`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function drawWorkout(){$('work').innerHTML=wo.exercises.map((e,ei)=>{let p=previousSummary(e.name);return`<div class="card exercise"><div class="between"><div><h3>${esc(e.name)}</h3><div class="muted">Target: ${esc(e.target)}${e.notes?' · '+esc(e.notes):''}</div><div class="muted">Last: ${p.last} · Best: ${p.best}</div></div></div>${e.sets.map((s,si)=>`<div class="set"><span>${si+1}</span><input class="input ${s.done?'done':''}" inputmode="decimal" placeholder="kg" value="${esc(s.weight)}" oninput="wo.exercises[${ei}].sets[${si}].weight=this.value;autoSave()"><input class="input ${s.done?'done':''}" inputmode="numeric" placeholder="reps" value="${esc(s.reps)}" oninput="wo.exercises[${ei}].sets[${si}].reps=this.value;autoSave()"><button class="icon ${s.done?'done':''}" onclick="toggleSet(${ei},${si})">${s.done?'✓':'○'}</button></div>`).join('')}<button class="btn" onclick="wo.exercises[${ei}].sets.push({weight:'',reps:'',done:false});autoSave();drawWorkout()">+ Set</button></div>`}).join('')}function toggleSet(e,s){let set=wo.exercises[e].sets[s],name=wo.exercises[e].name,old=exSessions(name).reduce((m,x)=>Math.max(m,x.max),0);set.done=!set.done;autoSave();drawWorkout();if(set.done){if((+set.weight||0)>old&&old>0)msg('New personal record!');startRest(d.rest)}}function finishWorkout(){wo.duration=Math.round((Date.now()-wo.started)/1000);wo.finished=Date.now();d.history.unshift(wo);d.active=null;save();wo=null;clearInterval(workTick);clearInterval(restTick);$('restTimer').style.display='none';closeM('workModal');renderHome();msg('Workout saved')}
function setRest(n){if(!n||n<1)return;d.rest=n;save();renderSettings();msg('Rest timer set to '+n+'s')}function startRest(sec){clearInterval(restTick);let left=sec;$('restTimer').style.display='block';let draw=()=>{$('restTimer').textContent=`Rest ${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;if(left--<=0){clearInterval(restTick);$('restTimer').style.display='none';msg('Rest complete')}};draw();restTick=setInterval(draw,1000)}
function saveWeight(){let v=+$('bw').value;if(!v)return msg('Enter a weight');d.weights.unshift({v,date:Date.now()});d.weights.sort((a,b)=>b.date-a.date);save();$('bw').value='';renderSettings();msg('Weight saved')}function setWeightRange(r,b){weightRange=r;document.querySelectorAll('#weightTabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');weightChart()}function filteredWeights(){let days={"1m":30,"3m":90,"6m":180,"1y":365,all:99999}[weightRange],cut=Date.now()-days*86400000;return d.weights.filter(x=>x.date>=cut).sort((a,b)=>a.date-b.date)}
function lineChart(id,pts,key,label){let c=$(id),x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);x.fillStyle=getComputedStyle(document.body).getPropertyValue('--card');x.fillRect(0,0,c.width,c.height);if(!pts.length){x.fillStyle='#777';x.font='14px sans-serif';x.fillText('Not enough data yet',18,28);return}let vals=pts.map(p=>p[key]),min=Math.min(...vals),max=Math.max(...vals);if(min===max)min-=1,max+=1;let pad=32;x.strokeStyle='#16a34a';x.lineWidth=3;x.beginPath();pts.forEach((p,i)=>{let px=pad+(c.width-2*pad)*(pts.length===1?.5:i/(pts.length-1)),py=c.height-pad-(c.height-2*pad)*(p[key]-min)/(max-min);i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke();x.fillStyle='#777';x.font='12px sans-serif';x.fillText(`${max.toFixed(1)} ${label}`,4,18);x.fillText(`${min.toFixed(1)} ${label}`,4,c.height-8)}function weightChart(){let a=filteredWeights(),change=a.length>1?a[a.length-1].v-a[0].v:0,dir=change>0?'↑':change<0?'↓':'→';$('weightChange').innerHTML=`<b>${a.length?`${a[a.length-1].v} kg`: 'No data'}</b><span class="${change?'pr':''}">${dir} ${Math.abs(change).toFixed(1)} kg</span>`;lineChart('weightChart',a,'v','kg')}
function renderProgress(){weightChart();let names=[...new Set(d.history.flatMap(w=>w.exercises.map(e=>e.name)))],sel=$('chartEx'),old=sel.value;sel.innerHTML=names.map(n=>`<option>${esc(n)}</option>`).join('');if(names.includes(old))sel.value=old;renderExercise();let volume=d.history.reduce((a,w)=>a+workoutVolume(w),0),hrs=d.history.reduce((a,w)=>a+w.duration,0)/3600,longest=longestStreak();$('lifetime').innerHTML=`<div class="card stat"><b>${d.history.length}</b><span>WORKOUTS</span></div><div class="card stat"><b>${hrs.toFixed(1)}</b><span>HOURS</span></div><div class="card stat"><b>${Math.round(volume).toLocaleString()}</b><span>KG LIFTED</span></div><div class="card stat"><b>${longest}</b><span>LONGEST STREAK</span></div>`;let prs=records();$('prs').innerHTML=prs.map(x=>`<div class="card between"><div><b>${esc(x.name)}</b><div class="muted">Estimated 1RM: ${estimated1RM(x.w,x.r)} kg</div></div><span class="pr">${x.w} kg × ${x.r}</span></div>`).join('')||'<div class="card muted">Complete weighted sets to see records.</div>'}
function renderExercise(){let n=$('chartEx').value,a=exSessions(n).reverse(),latest=a[a.length-1],best=a.reduce((x,y)=>!x||y.max>x.max?y:x,null);$('exSummary').innerHTML=latest?`<div class="card stat"><b>${latest.max}</b><span>MAX KG</span></div><div class="card stat"><b>${latest.reps}</b><span>REPS</span></div><div class="card stat"><b>${latest.sets}</b><span>SETS</span></div><div class="card stat"><b>${Math.round(latest.volume)}</b><span>VOLUME</span></div>`:'';lineChart('exChart',a,'max','kg');$('exHistory').innerHTML=[...a].reverse().slice(0,10).map(x=>`<div class="card between"><div><b>${new Date(x.date).toLocaleDateString()}</b><div class="muted">${x.sets} sets · ${x.reps} reps</div></div><span>${x.max} kg · ${Math.round(x.volume)} vol</span></div>`).join('')}
function records(){let z={};d.history.forEach(w=>w.exercises.forEach(e=>e.sets.filter(s=>s.done).forEach(s=>{let wgt=+s.weight||0,r=+s.reps||0,k=e.name.toLowerCase();if(wgt&&(!z[k]||estimated1RM(wgt,r)>estimated1RM(z[k].w,z[k].r)))z[k]={name:e.name,w:wgt,r,date:w.started}})));return Object.values(z).sort((a,b)=>estimated1RM(b.w,b.r)-estimated1RM(a.w,a.r))}function longestStreak(){let days=[...new Set(d.history.map(x=>new Date(x.started).toDateString()))].map(x=>+new Date(x)).sort((a,b)=>a-b),best=days.length?1:0,cur=best;for(let i=1;i<days.length;i++){if(Math.round((days[i]-days[i-1])/86400000)===1)cur++;else cur=1;best=Math.max(best,cur)}return best}
function saveGoals(){d.goals={weight:+$('goalWeight').value||'',freq:+$('goalFreq').value||'',exercise:$('goalExercise').value.trim(),strength:+$('goalStrength').value||''};save();renderSettings();msg('Goals saved')}function renderGoals(){let g=d.goals||{},html='';if(g.weight){let cur=d.weights[0]?.v,pc=cur?Math.min(100,Math.max(0,100-Math.abs(g.weight-cur)/Math.max(g.weight,cur)*100)):0;html+=`<div class="goal"><div class="between"><span>Weight: ${cur||'–'} / ${g.weight} kg</span><b>${Math.round(pc)}%</b></div><div class="bar"><div style="width:${pc}%"></div></div></div>`}if(g.freq){let n=d.history.filter(x=>x.started>=weekStart()).length,pc=Math.min(100,n/g.freq*100);html+=`<div class="goal"><div class="between"><span>Weekly workouts: ${n} / ${g.freq}</span><b>${Math.round(pc)}%</b></div><div class="bar"><div style="width:${pc}%"></div></div></div>`}if(g.exercise&&g.strength){let rec=records().find(x=>x.name.toLowerCase()===g.exercise.toLowerCase()),cur=rec?.w||0,pc=Math.min(100,cur/g.strength*100);html+=`<div class="goal"><div class="between"><span>${esc(g.exercise)}: ${cur} / ${g.strength} kg</span><b>${Math.round(pc)}%</b></div><div class="bar"><div style="width:${pc}%"></div></div></div>`}$('goalView').innerHTML=html||'<div class="muted">Set goals to track them here.</div>'}
function renderSettings(){let g=d.goals||{};$('goalWeight').value=g.weight||'';$('goalFreq').value=g.freq||'';$('goalExercise').value=g.exercise||'';$('goalStrength').value=g.strength||'';$('restInfo').textContent='Current preset: '+d.rest+' seconds';$('bwInfo').textContent=d.weights.length?'Latest: '+d.weights[0].v+' kg on '+new Date(d.weights[0].date).toLocaleDateString():'No weight entries yet';renderGoals()}function toggleDark(){d.dark=!d.dark;save();apply()}function apply(){document.body.classList.toggle('dark',d.dark)}
function download(name,text,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();URL.revokeObjectURL(a.href)}function exportJSON(){download('gym-plan-backup.json',JSON.stringify(d,null,2),'application/json')}function exportCSV(){let rows=[['Date','Workout','Duration minutes','Exercise','Weight kg','Reps','Set volume','Workout notes','Exercise notes']];d.history.forEach(w=>w.exercises.forEach(e=>e.sets.filter(s=>s.done).forEach(s=>rows.push([new Date(w.started).toISOString(),w.name,Math.round(w.duration/60),e.name,s.weight,s.reps,(+s.weight||0)*(+s.reps||0),w.notes||'',e.notes||'']))));download('gym-workouts.csv',rows.map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')).join('\n'),'text/csv')}function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.routines||!x.history)throw 0;d=x;save();location.reload()}catch{msg('Invalid backup file')}};r.readAsText(f)}
apply();renderHome();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
